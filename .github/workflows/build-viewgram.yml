name: Build ViewGram Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/lib/android/sdk/ndk/*
          df -h

      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK, NDK 27.2.12479018 & CMake 3.22.1
        uses: android-actions/setup-android@v3

      - name: Install required SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "build-tools;36.0.0" \
            "platforms;android-36" \
            "platform-tools" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Generate release keystore if missing
        run: |
          if [ ! -f TMessagesProj/config/release.keystore ]; then
            keytool -genkeypair -v \
              -keystore TMessagesProj/config/release.keystore \
              -alias androidkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=ViewGram, OU=Mobile, O=ViewGram, L=Net, ST=Net, C=US"
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build ViewGram Standalone APK
        run: ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone -POWPENGRAM_BUILD=0 --no-daemon --stacktrace

      - name: Upload APK and Keystore
        uses: actions/upload-artifact@v4
        with:
          name: ViewGram-Android-APK
          path: |
            TMessagesProj_AppStandalone/build/outputs/apk/afat/standalone/app.apk
            TMessagesProj/config/release.keystore
          retention-days: 30
